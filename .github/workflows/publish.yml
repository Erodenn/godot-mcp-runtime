name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assemble release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY_MAX_CHARS: 125000
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          highlights=".github/release-notes/${tag}.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" --jq .body > generated-notes.md
          if [ -f "$highlights" ]; then
            { cat "$highlights"; printf '\n'; cat generated-notes.md; } > release-notes.md
          else
            cp generated-notes.md release-notes.md
          fi
          chars=$(LC_ALL=C.UTF-8 wc -m < release-notes.md)
          if [ "$chars" -gt "$RELEASE_BODY_MAX_CHARS" ]; then
            echo "::error file=${highlights}::Release body is ${chars} characters; GitHub accepts at most ${RELEASE_BODY_MAX_CHARS}. Shorten the release notes before tagging."
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --verify-tag
